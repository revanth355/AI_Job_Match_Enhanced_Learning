services:
  - type: web
    name: ai-job-match
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r ai-job-match/requirements.txt
    startCommand: streamlit run ai-job-match/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
